{% extends "base.html" %}
{% block title %}{{ "Edit " ~ company.company_name if company else "Add company" }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ "Edit " ~ company.company_name if company else "Add company" }}</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="company_name" class="form-label">Company name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="company_name" name="company_name"
                           value="{{ form.company_name or '' }}" required maxlength="100">
                </div>
                <div class="col-md-6">
                    <label for="industry" class="form-label">Industry</label>
                    <input type="text" class="form-control" id="industry" name="industry"
                           value="{{ form.industry or '' }}" maxlength="50" placeholder="e.g. Technology">
                </div>
                <div class="col-md-6">
                    <label for="website" class="form-label">Website</label>
                    <input type="text" class="form-control" id="website" name="website"
                           value="{{ form.website or '' }}" maxlength="200" placeholder="https://example.com">
                </div>
                <div class="col-md-4">
                    <label for="city" class="form-label">City</label>
                    <input type="text" class="form-control" id="city" name="city"
                           value="{{ form.city or '' }}" maxlength="50">
                </div>
                <div class="col-md-2">
                    <label for="state" class="form-label">State</label>
                    <input type="text" class="form-control" id="state" name="state"
                           value="{{ form.state or '' }}" maxlength="50">
                </div>
                <div class="col-12">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea class="form-control" id="notes" name="notes" rows="3">{{ form.notes or '' }}</textarea>
                </div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">{{ "Save changes" if company else "Add company" }}</button>
                <a class="btn btn-outline-secondary"
                   href="{{ url_for('companies_detail', company_id=company.company_id) if company else url_for('companies') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
